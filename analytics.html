<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Status Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, collection, query, getDocs, onSnapshot, orderBy 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const HIDDEN_EMAIL = "clarence.stats@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyBe--2h0tR7n0uxhuqMzzWOhCYdc-o2b4E",
            authDomain: "cvc-openspaces.firebaseapp.com",
            projectId: "cvc-openspaces",
            storageBucket: "cvc-openspaces.firebasestorage.app",
            messagingSenderId: "230322442542",
            appId: "1:230322442542:web:524cc85eaa7af1a5a2aabf",
            measurementId: "G-Z5W4ZCJTPT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const getFieldsCol = (db) => collection(db, "sports_fields_status");
        const getStatusDoc = (db) => doc(db, "sports_fields_status_config", "statuses");
        const getLogsCol = (db) => collection(db, "sports_fields_logs");

        const LoadingSpinner = ({ text = "Loading..." }) => (
            <div className="flex flex-col items-center justify-center h-full w-full bg-slate-50">
                <svg className="animate-spin -ml-1 mr-3 h-10 w-10 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span className="text-lg font-medium text-slate-600">{text}</span>
            </div>
        );

        // Chart Component Wrapper
        const ChartWidget = ({ title, subtitle, type, data, options }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                
                if (chartRef.current && data) {
                    const ctx = chartRef.current.getContext('2d');
                    
                    // Base premium options for all charts
                    const baseOptions = {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { 
                                position: 'bottom', 
                                labels: { 
                                    usePointStyle: true, 
                                    padding: 20, 
                                    font: { family: "'Inter', sans-serif", size: 12, weight: '500' },
                                    color: '#475569'
                                } 
                            },
                            tooltip: { 
                                backgroundColor: 'rgba(15, 23, 42, 0.9)', 
                                titleFont: { family: "'Inter', sans-serif", size: 13, weight: 'bold' }, 
                                bodyFont: { family: "'Inter', sans-serif", size: 13 }, 
                                padding: 12, 
                                cornerRadius: 8, 
                                boxPadding: 6,
                                usePointStyle: true
                            }
                        }
                    };

                    // Add scale formatting for non-pie/doughnut charts
                    if (type !== 'doughnut' && type !== 'pie') {
                        baseOptions.scales = {
                            x: { 
                                grid: { display: false, drawBorder: false }, 
                                ticks: { font: { family: "'Inter', sans-serif", size: 11 }, color: '#64748b' } 
                            },
                            y: { 
                                border: { display: false },
                                grid: { color: '#e2e8f0', borderDash: [4, 4] }, 
                                ticks: { font: { family: "'Inter', sans-serif", size: 11 }, color: '#64748b', padding: 8 } 
                            }
                        };
                    }

                    // Deep merge options to prevent overwriting base scales if custom ones are provided
                    const mergedOptions = { ...baseOptions, ...options };
                    if (options?.scales?.y) mergedOptions.scales.y = { ...baseOptions.scales.y, ...options.scales.y };
                    if (options?.scales?.x) mergedOptions.scales.x = { ...baseOptions.scales.x, ...options.scales.x };

                    chartInstance.current = new Chart(ctx, {
                        type: type,
                        data: data,
                        options: mergedOptions
                    });
                }
                
                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [data, type, options]);

            return (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-full hover:shadow-md transition-shadow duration-300">
                    <div className="mb-6">
                        <h3 className="text-sm font-black text-slate-800 uppercase tracking-wider">{title}</h3>
                        {subtitle && <p className="text-xs font-medium text-slate-500 mt-1">{subtitle}</p>}
                    </div>
                    <div className="flex-1 relative min-h-[250px]">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            );
        };

        const PasswordScreen = ({ onLogin }) => {
            const [input, setInput] = useState("");
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => { 
                e.preventDefault(); 
                setError(null);
                setLoading(true);
                try {
                    await onLogin(HIDDEN_EMAIL, input);
                } catch (err) {
                    setError("Incorrect password.");
                    setInput(""); 
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 px-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                        <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                            <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        </div>
                        <h2 className="text-2xl font-black text-center text-slate-800 mb-2">Analytics Access</h2>
                        <p className="text-center text-slate-500 mb-8 font-medium">Enter password to view reporting.</p>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <input type="password" value={input} onChange={(e) => { setInput(e.target.value); setError(null); }} placeholder="Enter Password" 
                                    className={`w-full p-4 bg-slate-50 border rounded-xl focus:ring-4 focus:outline-none transition-all ${error ? 'border-red-300 focus:ring-red-100' : 'border-slate-200 focus:ring-indigo-100 focus:border-indigo-400'}`} 
                                    autoFocus disabled={loading}
                                />
                                {error && <p className="text-red-500 text-sm mt-2 font-medium px-1">{error}</p>}
                            </div>
                            <button type="submit" disabled={loading}
                                className={`w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition duration-200 shadow-md ${loading ? 'opacity-70 cursor-not-allowed' : 'hover:shadow-lg hover:-translate-y-0.5'}`}>
                                {loading ? 'Verifying...' : 'Access Dashboard'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const AnalyticsDashboard = ({ db, doLogout }) => {
            const [facilities, setFacilities] = useState([]);
            const [statuses, setStatuses] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            
            const [selectedFacName, setSelectedFacName] = useState('OVERVIEW');
            
            // Set default date range to last month
            const getInitialDates = () => {
                const now = new Date();
                const firstDayLastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const lastDayLastMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                
                // Format the local date manually to avoid UTC conversion shifts
                const formatDate = (date) => {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                };
                return { start: formatDate(firstDayLastMonth), end: formatDate(lastDayLastMonth) };
            };

            const [startDate, setStartDate] = useState(getInitialDates().start);
            const [endDate, setEndDate] = useState(getInitialDates().end);

            // Fetch all data
            useEffect(() => {
                if (!db) return;
                setLoading(true);
                const subs = [];
                try {
                    subs.push(onSnapshot(getStatusDoc(db), snap => setStatuses(snap.data()?.options || [])));
                    subs.push(onSnapshot(query(getFieldsCol(db)), snap => setFacilities(snap.docs.map(d => ({ id: d.id, ...d.data() })))));
                    subs.push(onSnapshot(query(getLogsCol(db), orderBy("timestamp", "asc")), snap => {
                        setLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setLoading(false);
                    }));
                } catch (err) { 
                    console.error(err); 
                    setLoading(false); 
                }
                return () => subs.forEach(u => u());
            }, [db]);

            // Parses string logs into structural timeline data and chart configs
            const analyzedData = useMemo(() => {
                if (!facilities.length || !logs.length) return { facilityMap: {}, globalStats: {}, engineData: {} };

                const start = startDate ? new Date(startDate) : null;
                if (start) start.setHours(0, 0, 0, 0);
                const end = endDate ? new Date(endDate) : null;
                if (end) end.setHours(23, 59, 59, 999);

                // Helper to calculate overlap between event [t1, t2] and selected range [s, e]
                const getIntersectingMs = (t1, t2, s, e) => {
                    const actualStart = s ? Math.max(t1.getTime(), s.getTime()) : t1.getTime();
                    const actualEnd = e ? Math.min(t2.getTime(), e.getTime()) : t2.getTime();
                    return Math.max(0, actualEnd - actualStart);
                };

                // 1. Initialize data structure based on current facilities
                const map = {};
                let totalFields = 0;
                
                facilities.forEach(fac => {
                    map[fac.name] = { name: fac.name, subFields: {} };
                    (fac.subFields || []).forEach(sf => {
                        map[fac.name].subFields[sf.name] = {
                            name: sf.name,
                            history: [],
                            totalDowntimeMs: 0,
                            totalClosedMs: 0,
                            totalSmpMs: 0,
                            lastKnownStatus: null,
                            currentStatusType: 'OPEN'
                        };
                        totalFields++;
                    });
                });

                const statusColors = {};
                statuses.forEach(s => {
                    statusColors[s.text.toLowerCase()] = s.color;
                    statusColors[s.text] = s.color;
                });

                // 2. Play history forward to build timelines
                logs.forEach(log => {
                    if (!log.timestamp) return;
                    const time = new Date(log.timestamp.seconds * 1000);
                    
                    if (log.message.startsWith("Updated ")) {
                        const match = log.message.match(/Updated (.*?) \((.*?)\) to (.*)/);
                        if (match) {
                            const facName = match[1];
                            const sfName = match[2];
                            const statusText = match[3];

                            if (map[facName] && map[facName].subFields[sfName]) {
                                const sfData = map[facName].subFields[sfName];
                                
                                let type = 'OPEN';
                                const lowerStatus = statusText.toLowerCase();
                                if (lowerStatus.includes('closed')) type = 'CLOSED';
                                else if (lowerStatus.includes('sports management') || lowerStatus.includes('smp')) type = 'SMP';
                                
                                sfData.history.push({ time, statusText, type });
                                sfData.lastKnownStatus = statusText;
                                sfData.currentStatusType = type;
                            }
                        }
                    }
                });

                // 3. Calculate Downtimes & finalize stats
                let totalDowntimeGlobalMs = 0;
                let totalClosedGlobalMs = 0;
                let totalSmpGlobalMs = 0;
                let currentlyClosedCount = 0;
                let maxDowntimeMs = 0;
                let mostImpactedField = null;
                const now = new Date();

                // Calculate total duration of the selected window for percentage calculations
                // If no start date, use the very first log entry, or default to 30 days ago
                let earliestLogTime = logs.length > 0 ? logs[0].timestamp?.seconds * 1000 : (now.getTime() - (30 * 24 * 60 * 60 * 1000));
                let windowStartMs = start ? start.getTime() : earliestLogTime;
                let windowEndMs = end ? end.getTime() : now.getTime();
                const rangeDurationMs = Math.max(1, windowEndMs - windowStartMs);

                const getAvailabilityPct = (downtimeMs) => {
                    const pct = 100 - ((downtimeMs / rangeDurationMs) * 100);
                    return Math.max(0, Math.min(100, pct)).toFixed(1);
                };

                const facLabels = [];
                const facClosedDays = [];
                const facSmpDays = [];
                const statusCounts = {};

                Object.values(map).forEach(fac => {
                    facLabels.push(fac.name);
                    let facilityClosedMs = 0;
                    let facilitySmpMs = 0;

                    Object.values(fac.subFields).forEach(sf => {
                        let lastTime = null;
                        let currentType = 'OPEN';
                        
                        sf.totalClosedMs = 0; 
                        sf.totalSmpMs = 0;
                        
                        // Count statuses for doughnut chart based on final state
                        if (sf.lastKnownStatus) {
                            statusCounts[sf.lastKnownStatus] = (statusCounts[sf.lastKnownStatus] || 0) + 1;
                        }

                        sf.history.forEach(entry => {
                            if (currentType === 'CLOSED' && lastTime) {
                                sf.totalClosedMs += getIntersectingMs(lastTime, entry.time, start, end);
                            } else if (currentType === 'SMP' && lastTime) {
                                sf.totalSmpMs += getIntersectingMs(lastTime, entry.time, start, end);
                            }
                            currentType = entry.type;
                            lastTime = entry.time;
                        });

                        // If it's currently in a downtime state, calculate up to right now
                        if (currentType === 'CLOSED' && lastTime) {
                            sf.totalClosedMs += getIntersectingMs(lastTime, now, start, end);
                        } else if (currentType === 'SMP' && lastTime) {
                            sf.totalSmpMs += getIntersectingMs(lastTime, now, start, end);
                        }
                        
                        sf.totalDowntimeMs = sf.totalClosedMs + sf.totalSmpMs;

                        if (sf.currentStatusType === 'CLOSED' || sf.currentStatusType === 'SMP') {
                            currentlyClosedCount++;
                        }
                        
                        facilityClosedMs += sf.totalClosedMs;
                        facilitySmpMs += sf.totalSmpMs;
                        
                        totalClosedGlobalMs += sf.totalClosedMs;
                        totalSmpGlobalMs += sf.totalSmpMs;
                        totalDowntimeGlobalMs += sf.totalDowntimeMs;

                        if (sf.totalDowntimeMs > maxDowntimeMs) {
                            maxDowntimeMs = sf.totalDowntimeMs;
                            mostImpactedField = `${fac.name} (${sf.name})`;
                        }

                        // Create a filtered history specifically for the UI view
                        sf.filteredHistory = sf.history.filter(entry => 
                            (!start || entry.time >= start) && (!end || entry.time <= end)
                        ).reverse();
                        
                        // Keep the original history reversed as well for display
                        sf.history.reverse();
                    });
                    
                    facClosedDays.push((facilityClosedMs / (1000 * 60 * 60 * 24)).toFixed(1));
                    facSmpDays.push((facilitySmpMs / (1000 * 60 * 60 * 24)).toFixed(1));
                });

                const facilityChartData = {
                    labels: facLabels,
                    datasets: [
                        {
                            label: 'Closed (Days)',
                            data: facClosedDays,
                            backgroundColor: 'rgba(239, 68, 68, 0.85)', // Red-500
                            hoverBackgroundColor: 'rgba(220, 38, 38, 1)',
                            borderRadius: 4,
                        },
                        {
                            label: 'Sports Mgt (Days)',
                            data: facSmpDays,
                            backgroundColor: 'rgba(245, 158, 11, 0.85)', // Amber-500
                            hoverBackgroundColor: 'rgba(217, 119, 6, 1)',
                            borderRadius: 4,
                        }
                    ]
                };

                const statusChartData = {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: Object.keys(statusCounts).map(k => statusColors[k] || '#94a3b8'),
                        borderWidth: 2,
                        borderColor: '#ffffff',
                        hoverOffset: 4
                    }]
                };

                const dates = [];
                const dailyCounts = {};
                
                // Determine date range for the line chart (Max 60 days to prevent crowding)
                let chartStart = new Date();
                chartStart.setDate(chartStart.getDate() - 13);
                chartStart.setHours(0,0,0,0);
                
                let chartEnd = new Date();
                chartEnd.setHours(23,59,59,999);

                if (start) chartStart = new Date(start);
                if (end) chartEnd = new Date(end);

                let dayDiff = Math.round((chartEnd - chartStart) / (1000 * 60 * 60 * 24));
                if (dayDiff > 60) {
                    chartStart = new Date(chartEnd);
                    chartStart.setDate(chartEnd.getDate() - 60);
                    dayDiff = 60;
                } else if (dayDiff < 0) {
                    dayDiff = 0; 
                }

                for(let i=0; i<=dayDiff; i++) {
                    const d = new Date(chartStart);
                    d.setDate(d.getDate() + i);
                    const dateStr = d.toLocaleDateString('en-AU', { month: 'short', day: 'numeric' });
                    dates.push(dateStr);
                    dailyCounts[dateStr] = 0;
                }

                logs.forEach(log => {
                    if(!log.timestamp) return;
                    const logDate = new Date(log.timestamp.seconds * 1000);
                    if (logDate >= chartStart && logDate <= chartEnd) {
                        const dateStr = logDate.toLocaleDateString('en-AU', { month: 'short', day: 'numeric' });
                        if (dailyCounts[dateStr] !== undefined) dailyCounts[dateStr]++;
                    }
                });

                const activityChartTitle = (startDate || endDate) ? `Updates Made (${dates.length} Days)` : `Updates Made (Last 14 Days)`;

                const activityChartData = {
                    labels: dates,
                    datasets: [{
                        label: 'Status Changes',
                        data: dates.map(d => dailyCounts[d]),
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#10b981',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.4 // Smooth curve
                    }]
                };

                // Helper to format ms to human readable Days
                const formatDays = (ms) => {
                    if (ms === 0) return "0 days";
                    const days = ms / (1000 * 60 * 60 * 24);
                    const val = days.toFixed(1);
                    return `${val} ${val === '1.0' ? 'day' : 'days'}`;
                };

                return { 
                    facilityMap: map, 
                    globalStats: {
                        totalFields,
                        currentlyClosedCount,
                        formatDays,
                        getAvailabilityPct
                    },
                    engineData: {
                        facilityChartData,
                        statusChartData,
                        activityChartData,
                        activityChartTitle,
                        mostImpactedField,
                        totalGlobalDowntime: totalDowntimeGlobalMs
                    }
                };
            }, [facilities, logs, statuses, startDate, endDate]);

            if (loading) return <LoadingSpinner text="Crunching history data..." />;

            const { facilityMap, globalStats, engineData } = analyzedData;
            const facNames = Object.keys(facilityMap).sort();
            const selectedData = facilityMap[selectedFacName];

            return (
                <div className="flex flex-col h-screen bg-slate-50">
                    {/* Top Navigation / Global Header */}
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4 shrink-0 shadow-sm z-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 p-2 rounded-lg">
                                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            </div>
                            <h1 className="text-xl font-bold text-slate-800 tracking-tight">Downtime Analytics</h1>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-6 justify-between md:justify-end">
                            {/* Date Picker Controls */}
                            <div className="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200">
                                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="bg-transparent text-sm font-medium text-slate-700 p-1 outline-none max-w-[125px]" />
                                <span className="text-slate-400 text-xs px-2">to</span>
                                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="bg-transparent text-sm font-medium text-slate-700 p-1 outline-none max-w-[125px]" />
                                {(startDate || endDate) && (
                                    <button onClick={() => {setStartDate(''); setEndDate('');}} className="ml-2 pr-2 text-slate-400 hover:text-red-500 transition-colors" title="Clear Date Range">
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                )}
                            </div>

                            <button onClick={doLogout} className="text-sm font-bold text-slate-500 hover:text-indigo-600 transition-colors border-l border-slate-200 pl-6">Log Out</button>
                        </div>
                    </header>

                    {/* Main Layout: Sidebar + Detail View */}
                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar */}
                        <aside className="w-72 bg-white border-r border-slate-200 flex flex-col h-full shrink-0">
                            <div className="p-4 border-b border-slate-100">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Views</h2>
                                <button 
                                    onClick={() => setSelectedFacName('OVERVIEW')}
                                    className={`w-full text-left px-4 py-3 rounded-xl font-semibold transition-all flex items-center justify-between ${selectedFacName === 'OVERVIEW' ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}
                                >
                                    Global Overview
                                    {selectedFacName === 'OVERVIEW' && <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>}
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Facilities Drill-down</h2>
                                <div className="space-y-1">
                                    {facNames.map(name => (
                                        <button 
                                            key={name}
                                            onClick={() => setSelectedFacName(name)}
                                            className={`w-full text-left px-4 py-2.5 rounded-lg text-sm transition-all flex items-center justify-between ${selectedFacName === name ? 'bg-indigo-600 text-white shadow-md font-medium' : 'text-slate-600 hover:bg-slate-100'}`}
                                        >
                                            <span className="truncate pr-2">{name}</span>
                                            {selectedFacName === name && <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </aside>

                        {}
                        <main className="flex-1 overflow-y-auto bg-slate-50/50 p-6 sm:p-8 relative">
                            
                            {selectedFacName === 'OVERVIEW' ? (
                                /* OVERVIEW DASHBOARD */
                                <div className="max-w-6xl mx-auto space-y-6 pb-20 animate-fade-in">
                                    <div className="flex items-center justify-between mb-8">
                                        <div>
                                            <h2 className="text-2xl font-black text-slate-800">Global Overview</h2>
                                            <p className="text-slate-500 font-medium text-sm mt-1">
                                                {(startDate || endDate) ? `Data calculated strictly between selected dates.` : `Showing all-time data across all facilities.`}
                                            </p>
                                        </div>
                                    </div>

                                    {/* KPI Row */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                        <div className="bg-gradient-to-br from-white to-slate-50 p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-300 flex items-center gap-5 group">
                                            <div className="p-4 bg-blue-50 text-blue-600 rounded-2xl shadow-inner group-hover:scale-110 transition-transform duration-300">
                                                <svg className="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Tracked Fields</p>
                                                <p className="text-3xl font-black text-slate-800 mt-1 tracking-tight">{globalStats.totalFields || 0}</p>
                                                <p className="text-[10px] text-slate-400 font-semibold mt-1">Across all facilities</p>
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-white to-slate-50 p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-300 flex items-center gap-5 group">
                                            <div className="p-4 bg-red-50 text-red-600 rounded-2xl shadow-inner group-hover:scale-110 transition-transform duration-300">
                                                <svg className="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Unavailable Right Now</p>
                                                <p className="text-3xl font-black text-red-600 mt-1 tracking-tight">{globalStats.currentlyClosedCount || 0}</p>
                                                <p className="text-[10px] text-slate-400 font-semibold mt-1">Fields closed or in sports mgt</p>
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-white to-slate-50 p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all duration-300 flex items-center gap-5 group">
                                            <div className="p-4 bg-indigo-50 text-indigo-600 rounded-2xl shadow-inner group-hover:scale-110 transition-transform duration-300">
                                                <svg className="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            </div>
                                            <div>
                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Cumulative Time Unavailable</p>
                                                <p className="text-3xl font-black text-indigo-600 mt-1 tracking-tight">{globalStats.formatDays ? globalStats.formatDays(engineData.totalGlobalDowntime) : '0 days'}</p>
                                                <p className="text-[10px] text-slate-400 font-semibold mt-1 leading-tight">Combined days closed or in sports mgt<br/>within selected dates</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Charts Row 1 */}
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[400px]">
                                        <div className="lg:col-span-2 h-full">
                                            <ChartWidget 
                                                title="Time Unavailable by Facility" 
                                                subtitle="Breakdown of 'Closed' vs 'Sports Management Policy' (in days)"
                                                type="bar" 
                                                data={engineData.facilityChartData} 
                                                options={{ 
                                                    indexAxis: 'y',
                                                    scales: {
                                                        x: { stacked: true },
                                                        y: { stacked: true }
                                                    }
                                                }} 
                                            />
                                        </div>
                                        <div className="h-full">
                                            <ChartWidget 
                                                title="Live Status Distribution" 
                                                subtitle="Current state of all tracked fields right now"
                                                type="doughnut" 
                                                data={engineData.statusChartData} 
                                                options={{ cutout: '75%' }} 
                                            />
                                        </div>
                                    </div>

                                    {/* Charts Row 2 */}
                                    <div className="h-[350px]">
                                         <ChartWidget 
                                            title="Admin Status Updates (Activity)"
                                            subtitle={engineData.activityChartTitle} 
                                            type="line" 
                                            data={engineData.activityChartData} 
                                            options={{ scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }} 
                                        />
                                    </div>

                                    {engineData.mostImpactedField && (
                                        <div className="mt-8 bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center gap-4">
                                            <span className="text-2xl">⚠️</span>
                                            <div>
                                                <h4 className="text-sm font-bold text-amber-800">Highest Closure Rate</h4>
                                                <p className="text-amber-700 text-sm mt-1"><strong>{engineData.mostImpactedField}</strong> has been closed the most during this specific time period.</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                /* FACILITY DRILL-DOWN VIEW */
                                <div className="max-w-5xl mx-auto space-y-6 pb-20 animate-fade-in">
                                    <div className="flex items-center justify-between border-b border-slate-200 pb-6 mb-6">
                                        <div>
                                            <h2 className="text-3xl font-black text-slate-800 tracking-tight">{selectedData.name}</h2>
                                            <p className="text-slate-500 mt-2 text-sm font-medium flex items-center gap-2">
                                                <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-xs">{Object.keys(selectedData.subFields).length} Fields</span>
                                                Closure Analytics Drill-down
                                            </p>
                                        </div>
                                    </div>

                                    <div className="space-y-8">
                                        {Object.values(selectedData.subFields).map((sf, index) => (
                                            <div key={index} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                                                <div className="flex flex-col lg:flex-row divide-y lg:divide-y-0 lg:divide-x divide-slate-100">
                                                    
                                                    {/* Field Header & Stats */}
                                                    <div className="p-6 lg:w-1/3 bg-slate-50/50 flex flex-col justify-between">
                                                        <div>
                                                            <div className="flex items-center justify-between mb-4">
                                                                <h3 className="text-lg font-bold text-slate-800">{sf.name}</h3>
                                                                <span className={`px-3 py-1 rounded-full text-xs font-bold shadow-sm ${
                                                                    sf.currentStatusType === 'CLOSED' ? 'bg-red-100 text-red-700 border border-red-200' : 
                                                                    sf.currentStatusType === 'SMP' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 
                                                                    'bg-green-100 text-green-700 border border-green-200'
                                                                }`}>
                                                                    {sf.currentStatusType === 'CLOSED' ? 'CURRENTLY CLOSED' : 
                                                                     sf.currentStatusType === 'SMP' ? 'SPORTS MANAGEMENT' : 'OPEN'}
                                                                </span>
                                                            </div>
                                                            <div className="mt-6 mb-4">
                                                                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Time Unavailable</p>
                                                                <p className="text-3xl font-black text-indigo-600">{globalStats.formatDays(sf.totalDowntimeMs)}</p>
                                                                <div className="flex gap-4 mt-2">
                                                                    <p className="text-xs font-medium text-slate-500"><span className="text-red-500 font-bold">Closed:</span> {globalStats.formatDays(sf.totalClosedMs)}</p>
                                                                    <p className="text-xs font-medium text-slate-500"><span className="text-amber-500 font-bold">Sports Mgt:</span> {globalStats.formatDays(sf.totalSmpMs)}</p>
                                                                </div>
                                                                {(startDate || endDate) && <p className="text-xs text-slate-400 mt-2">calculated within selected dates</p>}
                                                            </div>
                                                            
                                                            <div className="mt-4 pt-4 border-t border-slate-200">
                                                                <div className="flex justify-between items-center mb-1">
                                                                    <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Availability</p>
                                                                    <p className="text-sm font-black text-emerald-600">{globalStats.getAvailabilityPct(sf.totalDowntimeMs)}%</p>
                                                                </div>
                                                                <div className="w-full bg-slate-200 rounded-full h-2">
                                                                    <div className="bg-emerald-500 h-2 rounded-full" style={{ width: `${globalStats.getAvailabilityPct(sf.totalDowntimeMs)}%` }}></div>
                                                                </div>
                                                                <p className="text-[10px] text-slate-400 font-medium mt-1.5 leading-tight">Percentage of time this field was NOT closed during the selected period.</p>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Timeline View */}
                                                    <div className="p-6 flex-1 max-h-[400px] overflow-y-auto custom-scrollbar">
                                                        <div className="flex justify-between items-center mb-6 sticky top-0 bg-white z-10 pb-2 border-b border-slate-100">
                                                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Status Update Log</h4>
                                                        </div>
                                                        
                                                        {(!sf.filteredHistory || sf.filteredHistory.length === 0) ? (
                                                            <div className="flex items-center justify-center h-32 text-slate-400 text-sm italic">
                                                                No updates recorded in this period.
                                                            </div>
                                                        ) : (
                                                            <div className="space-y-4 border-l-2 border-slate-100 ml-3 pl-4">
                                                                {sf.filteredHistory.map((entry, i) => (
                                                                    <div key={i} className="relative">
                                                                        {/* Timeline Dot */}
                                                                        <div className={`absolute -left-[1.3rem] top-1.5 w-2.5 h-2.5 rounded-full ring-4 ring-white ${
                                                                            entry.type === 'CLOSED' ? 'bg-red-500' : 
                                                                            entry.type === 'SMP' ? 'bg-amber-500' : 
                                                                            'bg-emerald-500'
                                                                        }`}></div>
                                                                        
                                                                        <div>
                                                                            <p className="text-sm font-bold text-slate-800">Set to {entry.statusText}</p>
                                                                            <p className="text-xs font-medium text-slate-500 mt-0.5">{entry.time.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' })} at {entry.time.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' })}</p>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                    
                    <style dangerouslySetInnerHTML={{__html: `
                        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
                        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
                        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
                    `}} />
                </div>
            );
        };

        const App = () => {
            const [db, setDb] = useState(null);
            const [user, setUser] = useState(null);
            const [appReady, setAppReady] = useState(false);

            useEffect(() => {
                const _db = getFirestore(app);
                setDb(_db);
                
                const unsub = onAuthStateChanged(auth, u => {
                    setUser(u);
                    setAppReady(true);
                });
                return () => unsub();
            }, []);

            const handleLogin = (hiddenEmail, password) => {
                return signInWithEmailAndPassword(auth, hiddenEmail, password);
            };

            const handleLogout = () => {
                signOut(auth);
            };

            if (!appReady) return <LoadingSpinner text="Connecting to Secure Data..." />;
            if (!user) return <PasswordScreen onLogin={handleLogin} />;
            return <AnalyticsDashboard db={db} user={user} doLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
