<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Analytics & Downtime Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            onSnapshot, 
            collection, 
            query, 
            orderBy,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const HIDDEN_EMAIL = "clarence.stats@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyBe--2h0tR7n0uxhuqMzzWOhCYdc-o2b4E",
            authDomain: "cvc-openspaces.firebaseapp.com",
            projectId: "cvc-openspaces",
            storageBucket: "cvc-openspaces.firebasestorage.app",
            messagingSenderId: "230322442542",
            appId: "1:230322442542:web:524cc85eaa7af1a5a2aabf",
            measurementId: "G-Z5W4ZCJTPT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const getFieldsCol = (db) => collection(db, "sports_fields_status");
        const getStatusDoc = (db) => doc(db, "sports_fields_status_config", "statuses");
        const getLogsCol = (db) => collection(db, "sports_fields_logs");

        // --- COMPONENTS ---
        const LoadingSpinner = ({ text = "Loading data..." }) => (
            <div className="flex flex-col items-center justify-center h-full space-y-4">
                <svg className="animate-spin h-12 w-12 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span className="text-lg font-medium text-slate-600">{text}</span>
            </div>
        );

        const PasswordScreen = ({ onLogin }) => {
            const [input, setInput] = useState("");
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => { 
                e.preventDefault(); 
                setError(null); setLoading(true);
                try {
                    await onLogin(HIDDEN_EMAIL, input);
                } catch (err) {
                    setError("Incorrect password."); setInput(""); 
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 px-4">
                    <div className="max-w-md w-full bg-white rounded-xl shadow-lg p-8 border border-slate-200">
                        <div className="text-center mb-8">
                            <h2 className="text-2xl font-extrabold text-indigo-950">Analytics Dashboard</h2>
                            <p className="text-slate-500 mt-2">Enter your admin password to view insights.</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <input type="password" value={input} onChange={(e) => { setInput(e.target.value); setError(null); }} placeholder="Enter Password" 
                                    className={`w-full p-3 border rounded-lg focus:ring-2 focus:outline-none transition-shadow ${error ? 'border-red-400 focus:ring-red-200' : 'border-slate-300 focus:ring-indigo-200'}`} autoFocus disabled={loading} />
                                {error && <p className="text-red-500 text-sm mt-2 font-medium">{error}</p>}
                            </div>
                            <button type="submit" disabled={loading} className={`w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition duration-200 ${loading ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                {loading ? 'Authenticating...' : 'View Analytics'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const AnalyticsDashboard = ({ db, doLogout }) => {
            const [facilities, setFacilities] = useState([]);
            const [statuses, setStatuses] = useState([]);
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            
            const [selectedFacName, setSelectedFacName] = useState(null);

            // Fetch all data
            useEffect(() => {
                if (!db) return;
                setLoading(true);
                const subs = [];
                try {
                    subs.push(onSnapshot(getStatusDoc(db), (docSnap) => setStatuses(docSnap.data()?.options || [])));
                    subs.push(onSnapshot(query(getFieldsCol(db)), (snapshot) => {
                        const facs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => a.name.localeCompare(b.name));
                        setFacilities(facs);
                        if (facs.length > 0 && !selectedFacName) setSelectedFacName(facs[0].name);
                    }));
                    // Pull all logs ordered by time
                    subs.push(onSnapshot(query(getLogsCol(db), orderBy("timestamp", "asc")), (snap) => {
                        setLogs(snap.docs.map(d => ({id: d.id, ...d.data()})));
                        setLoading(false);
                    }));
                } catch (err) { console.error(err); setLoading(false); }
                return () => subs.forEach(u => u());
            }, [db]);

            // --- DATA ENGINE: Parses string logs into structural timeline data ---
            const analyzedData = useMemo(() => {
                if (!facilities.length || !logs.length) return { facilityMap: {}, globalStats: {} };

                // 1. Initialize data structure based on current facilities
                const map = {};
                let totalFields = 0;
                
                facilities.forEach(fac => {
                    map[fac.name] = { id: fac.id, name: fac.name, subFields: {} };
                    fac.subFields?.forEach(sf => {
                        map[fac.name].subFields[sf.name] = {
                            id: sf.id,
                            name: sf.name,
                            history: [],
                            totalDowntimeMs: 0,
                            isCurrentlyClosed: false,
                            lastKnownStatus: 'Unknown'
                        };
                        totalFields++;
                    });
                });

                // 2. Parse logs chronologically
                logs.forEach(log => {
                    if (!log.timestamp) return; // Skip pending writes
                    const time = new Date(log.timestamp.seconds * 1000);
                    
                    // Match format: "Updated Barnier Park (Soccer Fields 1) to Closed"
                    if (log.message?.startsWith('Updated ')) {
                        const match = log.message.match(/Updated (.*?) \((.*?)\) to (.*)/);
                        if (match) {
                            const facName = match[1];
                            const sfName = match[2];
                            const statusText = match[3];

                            if (map[facName] && map[facName].subFields[sfName]) {
                                const sfData = map[facName].subFields[sfName];
                                const isClosedStatus = statusText.toLowerCase().includes('closed');
                                
                                sfData.history.push({ time, statusText, isClosed: isClosedStatus });
                                sfData.lastKnownStatus = statusText;
                                sfData.isCurrentlyClosed = isClosedStatus;
                            }
                        }
                    }
                });

                // 3. Calculate Downtimes & finalize stats
                let totalDowntimeGlobalMs = 0;
                let currentlyClosedCount = 0;
                const now = new Date();

                Object.values(map).forEach(fac => {
                    Object.values(fac.subFields).forEach(sf => {
                        let lastClosedTime = null;
                        
                        sf.history.forEach(entry => {
                            if (entry.isClosed && !lastClosedTime) {
                                lastClosedTime = entry.time;
                            } else if (!entry.isClosed && lastClosedTime) {
                                sf.totalDowntimeMs += (entry.time.getTime() - lastClosedTime.getTime());
                                lastClosedTime = null;
                            }
                        });

                        // If it's currently closed, calculate downtime up to right now
                        if (lastClosedTime) {
                            sf.totalDowntimeMs += (now.getTime() - lastClosedTime.getTime());
                            currentlyClosedCount++;
                        }
                        
                        totalDowntimeGlobalMs += sf.totalDowntimeMs;
                        // Reverse history for timeline display (newest first)
                        sf.history.reverse();
                    });
                });

                // Format milliseconds to Days/Hours string
                const formatMs = (ms) => {
                    if (ms === 0) return "0 hrs";
                    const hours = Math.floor(ms / (1000 * 60 * 60));
                    const days = Math.floor(hours / 24);
                    if (days > 0) {
                        const remainingHours = hours % 24;
                        return `${days}d ${remainingHours}h`;
                    }
                    return `${hours}h`;
                };

                return { 
                    facilityMap: map, 
                    globalStats: {
                        totalFields,
                        currentlyClosedCount,
                        formatMs
                    } 
                };
            }, [facilities, logs]);

            if (loading) return <div className="h-screen"><LoadingSpinner text="Crunching history data..." /></div>;

            const { facilityMap, globalStats } = analyzedData;
            const selectedFacData = selectedFacName ? facilityMap[selectedFacName] : null;

            return (
                <div className="flex flex-col h-screen bg-slate-50">
                    {/* Top Navigation / Global Header */}
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0 shadow-sm z-10">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 p-2 rounded-lg">
                                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            </div>
                            <h1 className="text-xl font-bold text-slate-800 tracking-tight">Downtime Analytics</h1>
                        </div>
                        <div className="flex items-center gap-6">
                            <div className="hidden md:flex gap-6 mr-4 border-r border-slate-200 pr-6">
                                <div className="text-sm">
                                    <span className="text-slate-500 block text-xs font-semibold uppercase">Total Fields</span>
                                    <span className="font-bold text-slate-800 text-lg">{globalStats.totalFields || 0}</span>
                                </div>
                                <div className="text-sm">
                                    <span className="text-slate-500 block text-xs font-semibold uppercase">Currently Closed</span>
                                    <span className="font-bold text-red-600 text-lg">{globalStats.currentlyClosedCount || 0}</span>
                                </div>
                            </div>
                            <button onClick={doLogout} className="text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">Log Out</button>
                        </div>
                    </header>

                    {/* Main Layout: Sidebar + Detail View */}
                    <div className="flex flex-1 overflow-hidden">
                        
                        {/* Sidebar: Facilities List */}
                        <aside className="w-1/3 max-w-sm bg-white border-r border-slate-200 flex flex-col h-full overflow-y-auto">
                            <div className="p-4 bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                <h2 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Select Facility</h2>
                            </div>
                            <div className="divide-y divide-slate-100">
                                {Object.values(facilityMap).map(fac => (
                                    <button 
                                        key={fac.name} 
                                        onClick={() => setSelectedFacName(fac.name)}
                                        className={`w-full text-left p-4 hover:bg-indigo-50 transition-colors flex justify-between items-center group ${selectedFacName === fac.name ? 'bg-indigo-50 border-l-4 border-indigo-600' : 'border-l-4 border-transparent'}`}
                                    >
                                        <div>
                                            <div className={`font-semibold ${selectedFacName === fac.name ? 'text-indigo-900' : 'text-slate-700 group-hover:text-indigo-700'}`}>{fac.name}</div>
                                            <div className="text-xs text-slate-400 mt-1">{Object.keys(fac.subFields).length} tracked fields</div>
                                        </div>
                                        <svg className={`w-5 h-5 ${selectedFacName === fac.name ? 'text-indigo-500' : 'text-slate-300'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                    </button>
                                ))}
                            </div>
                        </aside>

                        {}
                        {/* Main Content Area: Field Drill-down */}
                        <main className="flex-1 overflow-y-auto bg-slate-50 p-6 lg:p-10">
                            {selectedFacData ? (
                                <div className="max-w-5xl mx-auto space-y-8">
                                    <div className="border-b border-slate-200 pb-4">
                                        <h2 className="text-3xl font-extrabold text-slate-900">{selectedFacData.name}</h2>
                                        <p className="text-slate-500 mt-1">Detailed history and downtime calculations per field.</p>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                                        {Object.values(selectedFacData.subFields).map(sf => (
                                            <div key={sf.name} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                                                
                                                {/* Card Header & Stats */}
                                                <div className="p-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-start">
                                                    <div>
                                                        <h3 className="font-bold text-lg text-slate-800">{sf.name}</h3>
                                                        <div className="flex items-center gap-2 mt-2">
                                                            <span className="text-xs font-semibold uppercase text-slate-500">Current Status:</span>
                                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${sf.isCurrentlyClosed ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>
                                                                {sf.lastKnownStatus}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="block text-xs font-bold text-slate-400 uppercase">Total Downtime</span>
                                                        <span className="block text-xl font-black text-indigo-600 mt-1">{globalStats.formatMs(sf.totalDowntimeMs)}</span>
                                                    </div>
                                                </div>

                                                {/* Timeline View */}
                                                <div className="p-5 flex-1 max-h-[400px] overflow-y-auto">
                                                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-4 sticky top-0 bg-white z-10 pb-2">Change Timeline</h4>
                                                    
                                                    {sf.history.length === 0 ? (
                                                        <div className="text-center py-8 text-slate-400 text-sm italic border-2 border-dashed border-slate-100 rounded-lg">
                                                            No status changes recorded yet.
                                                        </div>
                                                    ) : (
                                                        <div className="border-l-2 border-slate-200 ml-3 space-y-6 relative pb-4">
                                                            {sf.history.map((entry, idx) => (
                                                                <div key={idx} className="relative pl-6">
                                                                    {/* Timeline Dot */}
                                                                    <div className={`absolute -left-[9px] top-1.5 h-4 w-4 rounded-full border-4 border-white shadow-sm ${entry.isClosed ? 'bg-red-500' : 'bg-green-500'}`}></div>
                                                                    
                                                                    {/* Content */}
                                                                    <div>
                                                                        <div className="text-xs font-medium text-slate-500">
                                                                            {entry.time.toLocaleDateString('en-AU', { month: 'short', day: 'numeric', year: 'numeric' })} • {entry.time.toLocaleTimeString('en-AU', { hour: '2-digit', minute:'2-digit' })}
                                                                        </div>
                                                                        <div className={`font-semibold mt-0.5 ${entry.isClosed ? 'text-red-700' : 'text-slate-700'}`}>
                                                                            Set to {entry.statusText}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="h-full flex items-center justify-center text-slate-400">
                                    Select a facility from the sidebar to view insights.
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [appReady, setAppReady] = useState(false);

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, u => {
                    setUser(u);
                    setAppReady(true);
                });
                return () => unsub();
            }, []);

            const handleLogin = (hiddenEmail, password) => {
                return signInWithEmailAndPassword(auth, hiddenEmail, password);
            };

            const handleLogout = () => { signOut(auth); };

            if (!appReady) return <div className="h-screen bg-slate-50"><LoadingSpinner /></div>;
            if (!user) return <PasswordScreen onLogin={handleLogin} />;
            return <AnalyticsDashboard db={db} doLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
